<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Skincare Deep Research</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            :root {
                --tabbar-h: 3rem;
            }
            body {
                font-family: system-ui, sans-serif;
                color: #111;
            }
            h2 {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #999;
                font-weight: 400;
                margin-bottom: 0.75rem;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }
            button {
                padding: 0.75rem 1.5rem;
                background: #000;
                color: #fff;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }
            button:disabled {
                opacity: 0.3;
            }
            .empty {
                color: #999;
            }

            /* --- Layout: tab bar on top, one view below --- */
            #app {
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
            }
            #tabs {
                flex: none;
                height: var(--tabbar-h);
                display: flex;
                padding: 0 1.5rem;
                border-bottom: 1px solid #e0e0e0;
            }
            .tab {
                padding: 0 1rem;
                background: none;
                color: #999;
                border-bottom: 2px solid transparent;
            }
            .tab:hover,
            .tab[aria-selected="true"] {
                color: #000;
            }
            .tab[aria-selected="true"] {
                border-bottom-color: #000;
            }

            /* Chat view: Activity sidebar (20%) and conversation (80%) */
            #view-chat {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: 20% 80%;
            }
            #sidebar {
                min-width: 0;
                overflow-y: auto;
                padding: 1.25rem;
                border-right: 1px solid #e0e0e0;
            }
            #activity {
                list-style: none;
                font-size: 0.85rem;
                line-height: 1.7;
            }
            #activity .agent {
                font-weight: 600;
            }
            #activity .error {
                color: #dc2626;
            }
            #status {
                color: #999;
                text-transform: none;
                letter-spacing: 0;
            }
            #conversation {
                min-width: 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            #messages {
                flex: 1;
                overflow-y: auto;
                padding: 1.5rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .msg {
                max-width: 48rem;
                font-size: 0.8rem;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .msg.user {
                align-self: flex-end;
                padding: 0.6rem 0.9rem;
                background: #f3f3f3;
                font-family: system-ui, sans-serif;
                font-size: 0.9rem;
            }
            .msg.assistant {
                align-self: flex-start;
                font-family: ui-monospace, monospace;
            }
            .msg.error {
                color: #dc2626;
            }
            .msg.md {
                font-family: system-ui, sans-serif;
                font-size: 0.95rem;
                line-height: 1.65;
                white-space: normal;
            }
            .md > :first-child {
                margin-top: 0;
            }
            .md > :last-child {
                margin-bottom: 0;
            }
            .md h1,
            .md h2,
            .md h3,
            .md h4 {
                margin: 1.4em 0 0.5em;
                line-height: 1.3;
            }
            .md h1 {
                font-size: 1.35rem;
            }
            .md h2 {
                display: block;
                font-size: 1.15rem;
                text-transform: none;
                letter-spacing: 0;
                color: inherit;
                font-weight: 600;
            }
            .md h3 {
                font-size: 1rem;
            }
            .md p,
            .md ul,
            .md ol,
            .md blockquote,
            .md pre,
            .md table {
                margin: 0.75em 0;
            }
            .md ul,
            .md ol {
                padding-left: 1.5rem;
            }
            .md li + li {
                margin-top: 0.25em;
            }
            .md a {
                color: #2563eb;
                word-break: break-all;
            }
            .md code {
                padding: 0.1em 0.35em;
                background: #f3f3f3;
                font-family: ui-monospace, monospace;
                font-size: 0.85em;
            }
            .md pre {
                padding: 0.75rem 1rem;
                background: #f3f3f3;
                overflow-x: auto;
            }
            .md pre code {
                padding: 0;
                background: none;
            }
            .md blockquote {
                padding-left: 1rem;
                border-left: 3px solid #e0e0e0;
                color: #555;
            }
            .md table {
                display: block;
                max-width: 100%;
                overflow-x: auto;
                border-collapse: collapse;
                font-size: 0.85rem;
            }
            .md th,
            .md td {
                padding: 0.4rem 0.75rem;
                border: 1px solid #e0e0e0;
                text-align: left;
                vertical-align: top;
            }
            .md th {
                background: #fafafa;
            }
            .md hr {
                margin: 1.25em 0;
                border: none;
                border-top: 1px solid #e0e0e0;
            }
            .msg.thinking {
                color: #999;
                font-family: system-ui, sans-serif;
                font-size: 0.9rem;
            }
            .dots span {
                animation: dot-pulse 1.2s infinite both;
            }
            .dots span:nth-child(2) {
                animation-delay: 0.2s;
            }
            .dots span:nth-child(3) {
                animation-delay: 0.4s;
            }
            @keyframes dot-pulse {
                0%,
                80%,
                100% {
                    opacity: 0.15;
                }
                40% {
                    opacity: 1;
                }
            }
            #task {
                flex: none;
                padding: 1rem 1.5rem 1.25rem;
                border-top: 1px solid #e0e0e0;
            }
            #question {
                width: 100%;
                padding: 0.6rem 0;
                border: none;
                border-bottom: 1px solid #e0e0e0;
                font-size: 1rem;
                outline: none;
            }
            #question:focus {
                border-bottom-color: #000;
            }
            #examples {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
                margin-top: 0.75rem;
            }
            .example {
                padding: 0;
                background: none;
                color: #666;
                font-size: 0.8rem;
                text-transform: none;
                letter-spacing: 0;
                text-align: left;
            }
            .example:hover {
                color: #000;
                text-decoration: underline;
            }
            #run,
            #new-session {
                margin-top: 1rem;
            }
            #new-session {
                background: none;
                color: #666;
                border: 1px solid #e0e0e0;
                margin-left: 0.5rem;
            }

            /* Activity Panel view: the existing context timeline, filling the area under the tab bar.
               It stays in place (hidden, not removed) on the Chat tab so its scroll position survives. */
            body[data-tab] {
                margin-right: 0;
            }
            body[data-tab] #context-panel {
                top: var(--tabbar-h);
                left: 0;
                right: 0;
                bottom: 0;
                width: auto;
                position: fixed;
                border-left: none;
                z-index: 5;
            }
            body[data-tab] #context-panel.timeline {
                height: auto;
            }
            body[data-tab="chat"] #context-panel {
                visibility: hidden;
                pointer-events: none;
            }
            #context-panel:empty::before {
                content: "Detailed agent activity appears here once research starts.";
                font-family: system-ui, sans-serif;
                font-size: 0.85rem;
                color: #999;
            }

            @media (max-width: 800px) {
                #view-chat {
                    grid-template-columns: 1fr;
                    grid-template-rows: auto 1fr;
                }
                #sidebar {
                    max-height: 30vh;
                    border-right: none;
                    border-bottom: 1px solid #e0e0e0;
                }
            }
        
            /* --- Soft pastel theme: visual changes only --- */
            :root {
                --tabbar-h: 3.6rem;
                --gold: #b79b56;
                --gold-soft: #d4c18b;
                --ink: #403d53;
                --muted: #78738a;
                --panel: rgba(255, 255, 255, 0.79);
                --panel-blue: rgba(232, 242, 255, 0.68);
                --panel-purple: rgba(242, 236, 255, 0.64);
            }
            html, body { height: 100%; }
            body {
                color: var(--ink);
                background: linear-gradient(135deg, #e5f2ff 0%, #f8fbff 36%, #eee8ff 70%, #ffffff 100%);
            }
            #app { min-height: 0; }
            #tabs {
                height: var(--tabbar-h);
                flex: none;
                gap: .6rem;
                padding: .35rem 1.25rem .15rem;
                background: transparent;
                border-bottom: none;
            }
            .tab {
                padding: .6rem 1.25rem;
                color: #655c7d;
                background: rgba(255,255,255,.46);
                border: 2.5px solid var(--gold-soft);
                border-radius: 16px 16px 10px 10px;
                font-size: .85rem;
                font-weight: 650;
                letter-spacing: .02em;
                text-transform: none;
                transition: background .2s ease, box-shadow .2s ease;
            }
            .tab:hover { background: rgba(255,255,255,.82); color: var(--ink); }
            .tab[aria-selected="true"] {
                color: #53436f;
                border-color: var(--gold);
                background: linear-gradient(120deg, #e8f3ff, #f1eaff 78%, #fff);
                box-shadow: 0 3px 12px rgba(127,104,75,.1);
            }
            #view-chat {
                grid-template-columns: minmax(185px, 20%) minmax(0, 1fr);
                gap: 1rem;
                padding: 1rem 1.25rem 1.25rem;
                min-height: 0;
            }
            #sidebar, #conversation {
                border: 3px solid var(--gold);
                border-radius: 25px;
                box-shadow: 0 9px 28px rgba(110,96,145,.075), inset 0 0 0 1px rgba(255,255,255,.7);
                background: var(--panel);
                overflow: hidden;
            }
            #sidebar {
                overflow-y: auto;
                padding: 1.4rem 1rem;
                background: linear-gradient(155deg, rgba(255,255,255,.88), var(--panel-purple));
                border-right: 3px solid var(--gold);
            }
            #sidebar h2 { color: #756395; font-weight: 700; font-size: .8rem; }
            #status, .empty { color: var(--muted); }
            #activity { line-height: 1.65; }
            #activity li {
                padding: .55rem .25rem;
                border-bottom: 1px solid rgba(183,155,86,.2);
            }
            #activity .agent { color: #75618a; }
            #conversation {
                position: relative;
                background: linear-gradient(150deg, rgba(255,255,255,.85), var(--panel-blue) 60%, rgba(244,239,255,.82));
            }
            /* Outlined four-point stars (purely decorative; not interactive). */
            .chat-sparkle {
                position: absolute;
                z-index: 0;
                pointer-events: none;
                width: 72px;
                height: 72px;
                opacity: .72;
            }
            .chat-sparkle.top-left { top: 10px; left: 13px; }
            .chat-sparkle.bottom-right { right: 14px; bottom: 120px; transform: rotate(15deg); }
            #messages, #task { position: relative; z-index: 1; }
            #messages { padding: 3.4rem 1.7rem 1.4rem; gap: 1.15rem; }
            #intro { max-width: 55rem; color: #77718a; }
            .msg { font-size: .91rem; line-height: 1.65; }
            .msg.user {
                padding: .85rem 1.2rem;
                background: linear-gradient(115deg, #edf5ff, #f1eaff);
                border: 1px solid #d8c9ec;
                border-radius: 18px 18px 6px 18px;
                box-shadow: 0 2px 8px rgba(105,91,149,.06);
            }
            .msg.assistant:not(.thinking) { max-width: 56rem; }
            .msg.md { color: var(--ink); font-size: .96rem; }
            .md a { color: #63549d; }
            .md blockquote { border-left-color: var(--gold); }
            .md th, .md td { border-color: #d7ccaa; }
            .md th, .md pre, .md code { background: rgba(237,235,255,.6); }
            .md hr { border-top-color: #d8ca9f; }
            #task {
                padding: 1rem 1.5rem 1.3rem;
                border-top: 2px solid rgba(183,155,86,.58);
                background: rgba(255,255,255,.54);
            }
            #question {
                padding: .78rem 1rem;
                border: 1.5px solid #d5c69e;
                border-radius: 14px;
                background: rgba(255,255,255,.87);
                color: var(--ink);
            }
            #question:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(183,155,86,.13); }
            button { border-radius: 12px; }
            #run {
                background: #8473ac;
                color: white;
                border: 2px solid #a89abe;
            }
            #run:hover:not(:disabled) { background: #6f5e99; }
            #new-session {
                border: 2px solid var(--gold-soft);
                background: rgba(255,255,255,.7);
                color: #675676;
            }
            .example { color: #756b8c; }
            .example:hover { color: #65509c; }
            /* Preserve the original activity panel element and its JS behavior. */
            body[data-tab] #context-panel {
                top: calc(var(--tabbar-h) + .9rem);
                left: 1.25rem;
                right: 1.25rem;
                bottom: 1.25rem;
                width: auto;
                border: 3px solid var(--gold) !important;
                border-radius: 25px !important;
                background: linear-gradient(140deg, rgba(255,255,255,.96), #ecf3ff 62%, #f1ebff) !important;
                box-shadow: 0 9px 28px rgba(110,96,145,.1);
                overflow: auto;
            }
            body[data-tab="chat"] #context-panel { visibility: hidden; pointer-events: none; }
            @media (max-width: 800px) {
                #view-chat { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: .7rem; padding: .6rem; }
                #sidebar { max-height: 23vh; border: 3px solid var(--gold); border-radius: 20px; }
                #conversation { border-radius: 20px; }
                #tabs { padding: .3rem .6rem; }
                .tab { padding: .5rem .8rem; }
                #messages { padding: 3rem 1rem 1rem; }
                #task { padding: .75rem; }
                body[data-tab] #context-panel { left: .6rem; right: .6rem; bottom: .6rem; }
            }
            @media (prefers-reduced-motion: reduce) {
                .tab, .dots span { transition: none; animation: none; }
            }

        </style>
    </head>
    <body data-tab="chat">
        <div id="app">
            <nav id="tabs" role="tablist">
                <button id="tab-chat" class="tab" type="button" role="tab" aria-selected="true">Chat</button>
                <button id="tab-activity" class="tab" type="button" role="tab" aria-selected="false">Activity Panel</button>
            </nav>

            <div id="view-chat">
                <aside id="sidebar">
                    <h2>Activity <span id="status"></span></h2>
                    <ol id="activity"><li class="empty">Each agent's steps appear here.</li></ol>
                </aside>

                <div id="conversation">
                    <!-- Decorative outlined four-point sparkles -->
                    <svg class="chat-sparkle top-left" viewBox="0 0 90 90" fill="none" aria-hidden="true">
                        <path d="M31 4 Q36 29 59 36 Q36 42 31 69 Q26 43 4 36 Q27 29 31 4Z" stroke="#B79B56" stroke-width="2.3" stroke-linejoin="round" />
                        <path d="M67 13 Q70 23 79 26 Q70 29 67 40 Q64 29 55 26 Q64 23 67 13Z" stroke="#B79B56" stroke-width="1.8" stroke-linejoin="round" />
                    </svg>
                    <svg class="chat-sparkle bottom-right" viewBox="0 0 90 90" fill="none" aria-hidden="true">
                        <path d="M47 6 Q53 31 81 39 Q53 46 47 75 Q41 47 12 39 Q41 31 47 6Z" stroke="#B79B56" stroke-width="2.3" stroke-linejoin="round" />
                        <path d="M13 55 Q16 65 25 68 Q16 71 13 83 Q10 71 1 68 Q10 65 13 55Z" stroke="#B79B56" stroke-width="1.8" stroke-linejoin="round" />
                    </svg>
                    <div id="messages">
                        <p id="intro" class="empty">Skincare deep research: a lead splits your question, specialists search product, ingredient and clinical sources in parallel, and a writer turns their findings into a cited report.</p>
                    </div>

                    <form id="task">
                        <input id="question" value="Is niacinamide effective for acne, and what do safety reports say about products containing it?" placeholder="Ask about a product, an ingredient, or a skin concern" autocomplete="off" />
                        <div id="examples">
                            <button type="button" class="example">What's in Clinique Moisture Surge 100H? I don't really understand skincare ingredients. Can you explain what they do?</button>
                            <button type="button" class="example">Wait, does this stuff actually work? Or is it just marketing?</button>
                            <button type="button" class="example">Okay, but can this thing mess up my skin? Has anyone had bad reactions to it?</button>
                            <button type="button" class="example">Hey, have you heard of Clinique Moisture Surge Blueberry Moonlight Edition? What's in it? Is it any good?</button>
                        </div>
                        <button id="run" type="submit">Run</button>
                        <button id="new-session" type="button">New conversation</button>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
        <script src="/context-panel.js"></script>
        <script>
            const $ = (id) => document.getElementById(id);
            let source = null;
            let runId = null;
            let thinking = null; // the "Thinking..." / "Writing..." message while a run is in progress

            // --- Tabs: switching only changes what is shown; the SSE stream keeps running ---

            function setTab(tab) {
                document.body.dataset.tab = tab;
                $("tab-chat").setAttribute("aria-selected", String(tab === "chat"));
                $("tab-activity").setAttribute("aria-selected", String(tab === "activity"));
                $("view-chat").inert = tab !== "chat";
            }
            $("tab-chat").addEventListener("click", () => setTab("chat"));
            $("tab-activity").addEventListener("click", () => setTab("activity"));

            // --- Conversation ---

            // The report is built from model output and third-party API text, so it is sanitized before it
            // touches innerHTML. Links open in a new tab. Without the libraries, it falls back to plain text.
            if (window.DOMPurify) {
                DOMPurify.addHook("afterSanitizeAttributes", (node) => {
                    if (node.tagName === "A") {
                        node.setAttribute("target", "_blank");
                        node.setAttribute("rel", "noopener noreferrer");
                    }
                });
            }

            function renderMarkdown(div, text) {
                if (!window.marked || !window.DOMPurify) {
                    div.textContent = text;
                    return;
                }
                div.classList.add("md");
                div.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }));
            }

            function addMessage(role, text, cls = "", markdown = false) {
                $("intro")?.remove();
                const div = document.createElement("div");
                div.className = "msg " + role + (cls ? " " + cls : "");
                if (markdown) renderMarkdown(div, text);
                else div.textContent = text;
                $("messages").appendChild(div);
                $("messages").scrollTop = $("messages").scrollHeight;
                return div;
            }

            function showThinking() {
                clearThinking();
                thinking = addMessage("assistant", "", "thinking");
                const label = document.createElement("span");
                const dots = document.createElement("span");
                dots.className = "dots";
                dots.innerHTML = "<span>.</span><span>.</span><span>.</span>";
                label.textContent = "Thinking";
                thinking.append(label, dots);
            }

            function setThinkingLabel(text) {
                if (thinking) thinking.firstChild.textContent = text;
            }

            function clearThinking() {
                thinking?.remove();
                thinking = null;
            }

            // --- Activity sidebar ---

            function addActivity(agent, text, cls = "") {
                const li = document.createElement("li");
                li.className = cls;
                if (agent) {
                    const name = document.createElement("span");
                    name.className = "agent";
                    name.textContent = agent + " ";
                    li.appendChild(name);
                }
                li.append(text);
                $("activity").appendChild(li);
            }

            function finish(message) {
                $("status").textContent = message;
                $("run").disabled = false;
                source.close();
            }

            $("new-session").addEventListener("click", async () => {
                if (source) source.close();
                await fetch("/session/new", { method: "POST" });
                $("activity").replaceChildren();
                const empty = document.createElement("li");
                empty.className = "empty";
                empty.textContent = "Each agent's steps appear here.";
                $("activity").appendChild(empty);
                $("messages").replaceChildren();
                clearThinking();
                $("status").textContent = "new conversation";
                $("run").disabled = false;
                resetContext();
            });

            document.querySelectorAll(".example").forEach((button) => {
                button.addEventListener("click", () => {
                    $("question").value = button.textContent;
                    $("question").focus();
                });
            });

            $("task").addEventListener("submit", (e) => {
                e.preventDefault();
                const question = $("question").value.trim();
                if (!question || $("run").disabled) return;
                if (source) source.close();
                const params = new URLSearchParams({ question });

                addMessage("user", question);
                showThinking();
                $("question").value = "";
                $("activity").replaceChildren();
                $("status").textContent = "running";
                $("run").disabled = true;
                resetContext();
                setTab("activity");

                source = new EventSource("/run?" + params);
                source.onmessage = (msg) => {
                    const event = JSON.parse(msg.data);
                    if (event.type === "start") runId = event.run_id;
                    else if (event.type === "context") showContext(runId);
                    else if (event.type === "activity") {
                        addActivity(event.agent, event.text);
                        if (event.agent === "Writer" && event.text === "started") setThinkingLabel("Writing");
                    } else if (event.type === "done") {
                        clearThinking();
                        addMessage("assistant", event.markdown, "", true);
                        finish("done");
                    } else if (event.type === "error") {
                        clearThinking();
                        addMessage("assistant", event.message, "error");
                        addActivity("", event.message, "error");
                        finish("failed");
                    }
                };
                source.onerror = () => {
                    clearThinking();
                    addMessage("assistant", "Lost the connection to the server.", "error");
                    addActivity("", "Lost the connection to the server.", "error");
                    finish("failed");
                };
            });
        </script>
    </body>
</html>
